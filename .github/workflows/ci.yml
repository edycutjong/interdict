name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing; cancel it rather than paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy interdict --ignore-missing-imports

  tests:
    name: tests (real Postgres)
    runs-on: ubuntu-latest

    # The correctness this project claims -- an unforkable ledger, illegal-transition
    # rejection, idempotent holds, crash-safe checkpointing -- is enforced by Postgres,
    # so the tests that prove it need a real Postgres. They skip when one is absent,
    # which means a CI job without this service would go green having verified none of
    # it. The skip-count guard below exists to make that impossible to do accidentally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interdict
          POSTGRES_PASSWORD: interdict
          POSTGRES_DB: interdict
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U interdict -d interdict"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      INTERDICT_DSN: postgresql://interdict:interdict@localhost:5433/interdict

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Apply schema
        run: psql "$INTERDICT_DSN" -v ON_ERROR_STOP=1 -f interdict/schema.sql

      - name: Fetch the live OFAC publication
        # The parser tests assert on the real feed (the publshInformation typo, the record
        # count against the publication's own header, the weak-alias share). SDN.XML is 27MB
        # and gitignored, so CI fetches it. Non-fatal here only because the guard below turns
        # a failed fetch into a hard failure with a readable reason -- `continue-on-error`
        # without that guard would mean the data-provenance tests silently vanish.
        continue-on-error: true
        run: |
          curl -sSL --fail --max-time 180 -o data/SDN.XML \
            "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.XML" \
            && bash scripts/check_sdn.sh data/SDN.XML \
            || echo "OFAC fetch failed or returned junk; the guard step will fail the job"

      - name: Tests + coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml -ra

      - name: Guard against silently-skipped database and provenance tests
        # A green run that skipped the ledger and money tests is worse than a red one,
        # because it reads as proof. Fail if those suites did not execute.
        #
        # test_ofac_parse.py is in this list because it skips when data/SDN.XML is absent,
        # and the fetch above is continue-on-error: without it here, a Treasury outage
        # silently drops every assertion about the real publication and CI still goes green.
        run: |
          python - <<'EOF'
          import subprocess, sys, re
          SUITES = ["tests/test_ledger.py", "tests/test_money.py",
                    "tests/test_orchestrator.py", "tests/test_rescreen.py",
                    "tests/test_ofac_parse.py", "tests/test_matcher.py"]
          collect = subprocess.run(
              [sys.executable, "-m", "pytest", "--collect-only", "-q", *SUITES],
              capture_output=True, text=True)
          # A collection error yields zero collected and zero skipped, which would otherwise
          # read exactly like a clean run. Assert the count, not just the absence of skips --
          # and take the count from pytest's own summary line. Counting "::" substrings in
          # stdout, as this did, could be inflated over the floor by one warning line while an
          # entire suite failed to import: exit 0, nothing run, guard satisfied.
          m = re.search(r"(\d+) tests? collected", collect.stdout)
          if collect.returncode != 0 or not m:
              print(collect.stdout[-3000:])
              sys.exit(f"FAIL: collection exited {collect.returncode} -- a guarded suite did "
                       "not import, which is not a passing test run.")
          collected = int(m.group(1))
          run = subprocess.run(
              [sys.executable, "-m", "pytest", "-q", "-ra", *SUITES],
              capture_output=True, text=True)
          print(run.stdout[-2000:])
          if run.returncode != 0:
              sys.exit(f"FAIL: the guarded suites exited {run.returncode}.")
          skipped = int((re.search(r"(\d+) skipped", run.stdout) or [0, 0])[1])
          print(f"guarded tests collected={collected} skipped={skipped}")
          # A fraction of a recorded baseline rather than a hardcoded integer: with a fixed
          # floor, adding tests elsewhere eventually lets a broken import coast in underneath
          # a number that stopped tracking reality.
          BASELINE = 110
          if collected < BASELINE * 0.9:
              sys.exit(f"FAIL: only {collected} tests collected across {len(SUITES)} suites "
                       f"against a baseline of {BASELINE} -- a suite is missing.")
          if skipped:
              sys.exit("FAIL: guarded tests skipped -- Postgres was unreachable or the OFAC "
                       "publication is missing, so the ledger, money, orchestrator and "
                       "data-provenance assertions were NOT verified.")
          EOF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pip-audit
        run: pip-audit --requirement requirements.txt --strict

  reproduce:
    name: reproduce the published numbers
    runs-on: ubuntu-latest
    # The README quotes a screening number. This job re-derives it from scratch so the
    # figure cannot quietly drift away from the code that produced it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch the live OFAC publication
        run: |
          curl -sSL --fail --max-time 180 -o data/SDN.XML \
            "https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.XML"
          bash scripts/check_sdn.sh data/SDN.XML

      - name: Verify the sealed sentinel book
        # This step used to echo the committed hash and the re-derived hash and never compare
        # them, so it was green whichever way they came out. verify_book.py compares, and it
        # exits non-zero. It also knows that an exact re-derivation is only possible against
        # the sealed snapshot itself -- against a later publication it asserts the book still
        # resolves and reports which sentinels Treasury has delisted since.
        run: python scripts/verify_book.py --sdn data/SDN.XML

      - name: Benchmark, and check it against the published figures
        # --json-out to /tmp because the default is data/bench.json, i.e. CI was overwriting
        # the committed figures it is supposed to be defending. --against makes the comparison
        # the job's name has always implied.
        run: python scripts/bench.py --runs 1 --json-out /tmp/bench.json --against data/bench.json

  e2e:
    name: e2e (published surfaces)
    runs-on: ubuntu-latest
    # /judge is the page the submission entry links to, and a judge page that breaks on
    # submission day is worse than none. This job asserts it returns 200 with no
    # credentials and no session -- the property that would silently rot if auth were
    # ever introduced in front of it. It needs no database, no API key and no network.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  perf:
    name: lighthouse (perf · a11y · seo)
    runs-on: ubuntu-latest
    # Accessibility is asserted at 1.00, not 0.9. This is a compliance surface; a judge
    # using a screen reader is not an edge case, and the thresholds live in
    # lighthouserc.json so a regression fails here rather than being noticed later.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Lighthouse CI
        # Run through npx rather than as a devDependency. @lhci/cli bundles lighthouse ->
        # puppeteer-core -> extract-zip, which drags 12 advisories (5 of them HIGH) into
        # package-lock.json for a tool that never ships and only runs here. No published
        # version fixes it -- 0.15.1 makes it worse. Fetched at run time instead, so the
        # committed lockfile stays at 0 vulnerabilities.
        run: npx --yes @lhci/cli@0.14.0 autorun
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
