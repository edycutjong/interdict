name: gitleaks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# GitHub's own secret scanning covers known provider patterns on pushed commits.
# gitleaks catches project-shaped secrets and scans HISTORY, which is what matters at a
# private -> public flip: a key removed in the working tree is still in the log.
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history -- scanning the past is the entire point

      # Run the binary directly rather than gitleaks-action@v2. The action builds its own
      # --log-opts from the event payload and ignores fetch-depth entirely: every run this
      # repository has ever made logged `--log-opts=-1`, `1 commits scanned`, `~823 bytes`.
      # A green check on 823 bytes of one diff reads as "the history is clean" and means
      # nothing of the sort -- which is worse than no check, because it is believed.
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan the full history
        run: /tmp/gitleaks detect --source . --log-opts="--all" --redact --no-banner -v
