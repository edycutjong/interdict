# Local stack for Interdict. All three services run in Docker on this machine; none of
# them is deployed anywhere, and there is no deploy target in the Makefile.
#
#   postgres        holds, ledger, outbox, rescreen_batches — the correctness core
#   elasticsearch   the index yente searches
#   yente           the external screening oracle (OpenSanctions, run unmodified)
#
# The screening plane reaches all three over env-var connection strings and imports no
# GCP SDK, so the same code would run against a hosted Postgres without a rewrite. That
# is a property of the code, not a deployment that exists: see README.md, "On what is not
# here" — no Cloud Run, Cloud SQL, Cloud Scheduler or Pub/Sub was ever deployed, because
# the GCP billing account is closed. Cloud Firestore's free tier is the one hosted
# service in this build, and it is reached from interdict/cloud.py, not from here.

name: interdict

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: interdict
      POSTGRES_PASSWORD: interdict
      POSTGRES_DB: interdict
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interdict -d interdict"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  yente:
    image: ghcr.io/opensanctions/yente:4.2.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      YENTE_INDEX_TYPE: elasticsearch
      YENTE_INDEX_URL: http://elasticsearch:9200
      YENTE_MANIFEST: /manifests/yente-manifest.yml
      YENTE_AUTO_REINDEX: "false"
      YENTE_UPDATE_TOKEN: ""
    ports:
      - "8000:8000"
    volumes:
      - ./yente-manifest.yml:/manifests/yente-manifest.yml:ro

volumes:
  pgdata:
  esdata:
